  <text x="720" y="348" fill="#dbeafe" font-family="Consolas, monospace" font-size="14">&lt;html&gt;</text>
  <text x="742" y="378" fill="#bfdbfe" font-family="Consolas, monospace" font-size="14">&lt;body&gt;</text>
  <text x="764" y="408" fill="#bbf7d0" font-family="Consolas, monospace" font-size="14">&lt;section&gt;</text>
  <text x="786" y="438" fill="#cffafe" font-family="Consolas, monospace" font-size="14">&lt;h1&gt;</text>
  <text x="786" y="468" fill="#cffafe" font-family="Consolas, monospace" font-size="14">&lt;p&gt;</text>

  <rect x="872" y="282" width="168" height="113" rx="10" fill="#0b1626" stroke="#26364e"/>
  <text x="894" y="314" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Matched CSS</text>
  <text x="894" y="346" fill="#dbeafe" font-family="Consolas, monospace" font-size="13">#panel { width }</text>
  <text x="894" y="371" fill="#bbf7d0" font-family="Consolas, monospace" font-size="13">.title { color }</text>

  <rect x="872" y="413" width="168" height="113" rx="10" fill="#0b1626" stroke="#26364e"/>
  <text x="894" y="445" fill="#22c55e" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Layout Boxes</text>
  <rect x="897" y="466" width="92" height="34" rx="4" fill="#67e8f9" opacity="0.14" stroke="#67e8f9"/>
  <rect x="916" y="478" width="54" height="12" rx="2" fill="#22c55e" opacity="0.42"/>

  <rect x="127" y="592" width="966" height="1" fill="url(#accent)" opacity="0.7"/>
  <text x="136" y="631" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Tabs, downloads, session restore, request blocking, local search, parser tests</text>
  <text x="920" y="631" fill="#cffafe" font-family="Consolas, monospace" font-size="16">CMake + Ninja</text>
</svg>

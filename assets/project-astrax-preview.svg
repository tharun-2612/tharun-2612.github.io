  <rect x="698" y="206" width="342" height="54" rx="10" fill="#0f1c30" stroke="#2c4261"/>
  <text x="721" y="239" fill="#e5f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">AstraX Engine Lab</text>


  <text x="334" y="418" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">Profile</text>
  <text x="490" y="391" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Tracker Block</text>
  <text x="490" y="418" fill="#22c55e" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">Policy</text>

  <rect x="154" y="466" width="448" height="72" rx="10" fill="#0f1c30" stroke="#213652"/>
  <text x="178" y="493" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">AstraX Search</text>
  <text x="178" y="520" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Local ranking first, web fallback second</text>

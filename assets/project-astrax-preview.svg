  <rect x="413" y="112" width="166" height="34" rx="8" fill="#0b1424" stroke="#22314a"/>
  <text x="435" y="134" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Engine Lab</text>

  <rect x="128" y="182" width="516" height="390" rx="14" fill="#091525" stroke="#1e3149"/>
  <text x="154" y="224" fill="#e6fbff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">AstraX Browser</text>
  <text x="156" y="255" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="16">C++20 + Qt 6 + Chromium WebEngine</text>

  <rect x="154" y="286" width="448" height="48" rx="8" fill="#0f1c30" stroke="#2d4262"/>
  <text x="178" y="316" fill="#cffafe" font-family="Consolas, monospace" font-size="17">Search bookmarks, history, or the web</text>

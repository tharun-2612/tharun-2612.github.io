<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AstraX Browser preview</title>
  <desc id="desc">A dark desktop browser interface with tabs, local search results, and an engine lab panel showing DOM, CSS, and layout boxes.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="42" x2="1110" y2="636" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0d1727"/>
      <stop offset="1" stop-color="#08131d"/>
    </linearGradient>
    <linearGradient id="chrome" x1="110" y1="94" x2="1090" y2="564" gradientUnits="userSpaceOnUse">
      <stop stop-color="#132033"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="accent" x1="126" y1="114" x2="1038" y2="586" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.54" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.38 0 0 0 0 0.91 0 0 0 0 0.98 0 0 0 0.22 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="0" fill="url(#bg)"/>
  <path d="M96 92C176 50 294 42 396 80C529 130 629 57 755 54C904 51 1034 111 1102 217C1166 317 1136 468 1049 555C960 645 797 637 660 604C550 577 452 604 331 584C186 560 91 469 70 350C50 236 23 130 96 92Z" fill="#67e8f9" opacity="0.05"/>
  <path d="M107 587L1100 116" stroke="#67e8f9" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M138 632L1130 188" stroke="#22c55e" stroke-opacity="0.09" stroke-width="2"/>

  <rect x="92" y="76" width="1016" height="536" rx="24" fill="#08111f" stroke="#243247" stroke-width="2"/>
  <rect x="110" y="94" width="980" height="500" rx="16" fill="url(#chrome)" stroke="#334155"/>

  <rect x="110" y="94" width="980" height="72" rx="16" fill="#101b2d"/>
  <rect x="110" y="146" width="980" height="20" fill="#101b2d"/>

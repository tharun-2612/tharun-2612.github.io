<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Talent Board WordPress job portal preview</title>
  <desc id="desc">A dark WordPress job portal interface with search filters, employer dashboard, candidate saved jobs, application workflow, and plugin architecture panels.</desc>
  <defs>
    <linearGradient id="bg" x1="92" y1="54" x2="1090" y2="626" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111f"/>
      <stop offset="0.45" stop-color="#0e1b2b"/>
      <stop offset="1" stop-color="#061421"/>
    </linearGradient>
    <linearGradient id="accent" x1="166" y1="110" x2="1038" y2="588" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.38 0 0 0 0 0.91 0 0 0 0 0.98 0 0 0 0.18 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
  </defs>

